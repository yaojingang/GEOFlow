# postgres 凭据由 DB_* 插值映射为官方镜像的 POSTGRES_*；redis 使用 REDIS_PASSWORD。
# 多版本部署：每套实例设置不同的项目名、网络、子网、WEB_PORT 和数据目录；镜像会自动变成 {项目名}-app / {项目名}-web。
# -p 会覆盖 Compose 项目名并参与 image: 插值；显式网络名、子网、WEB_PORT 和数据目录仍须逐实例设置。
# 推荐：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
name: ${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}

x-prod-app-build-args: &prod_app_build_args
  COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
  PHP_FPM_IMAGE: ${PHP_FPM_IMAGE:-php:8.4-fpm-bookworm}
  PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
  COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
  HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-${DOCKER_BUILD_HTTP_PROXY:-}}
  NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis}

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_DB: "${DB_DATABASE:-geo_flow}"
      POSTGRES_USER: "${DB_USERNAME:-geo_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-this-password}"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/prod/postgres}:${POSTGRES_CONTAINER_DATA_DIR:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    # 以 root 启动，镜像入口脚本才会修改 /data 属主并降权。降权工具由镜像自带的 docker-entrypoint.sh 决定。
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        set -- redis-server --appendonly yes --dir /data
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          set -- "$$@" --requirepass "$${REDIS_PASSWORD}"
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
    volumes:
      - ${REDIS_DATA_DIR:-./docker-data/prod/redis}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "${AUTO_FIX_STORAGE_PERMISSIONS:-true}"
      GEOFLOW_SECURITY_FRESH_INSTALL_CONFIRMED: "true"
    command: ["php", "artisan", "about"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    mem_limit: ${APP_CONTAINER_MEMORY_LIMIT:-768m}
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: ${GEOFLOW_WEB_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-web}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${WEB_PORT:-18080}:80"
    environment:
      GEOFLOW_NGINX_PRIMARY_HOST: "${GEOFLOW_NGINX_PRIMARY_HOST:-localhost}"
      GEOFLOW_NGINX_PRIMARY_ALIASES: "${GEOFLOW_NGINX_PRIMARY_ALIASES:-}"
      GEOFLOW_NGINX_HOSTED_ROOT_DOMAIN: "${GEOFLOW_NGINX_HOSTED_ROOT_DOMAIN:-invalid}"
      GEOFLOW_NGINX_PUBLIC_SCHEME: "${GEOFLOW_NGINX_PUBLIC_SCHEME:-http}"
      GEOFLOW_NGINX_PUBLIC_PORT: "${GEOFLOW_NGINX_PUBLIC_PORT:-80}"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Host: $${GEOFLOW_NGINX_PRIMARY_HOST}\" -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "-d", "memory_limit=256M", "artisan", "queue:work", "redis", "--queue=system-updates,geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=930", "--memory=128", "--max-jobs=100", "--max-time=3600"]
    mem_limit: ${QUEUE_CONTAINER_MEMORY_LIMIT:-384m}
    stop_grace_period: 960s
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-quality-queue:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "-d", "memory_limit=256M", "artisan", "geoflow:work-ai-quality", "front"]
    mem_limit: ${AI_QUALITY_QUEUE_CONTAINER_MEMORY_LIMIT:-384m}
    stop_grace_period: ${GEOFLOW_AI_QUALITY_STOP_GRACE_PERIOD:-260s}
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${AI_QUALITY_QUEUE_REPLICAS:-2}

  ai-quality-backfill-queue:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "-d", "memory_limit=192M", "artisan", "geoflow:work-ai-quality", "backfill"]
    mem_limit: ${AI_QUALITY_BACKFILL_QUEUE_CONTAINER_MEMORY_LIMIT:-256m}
    stop_grace_period: ${GEOFLOW_AI_QUALITY_STOP_GRACE_PERIOD:-260s}
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-optimization-queue:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "-d", "memory_limit=256M", "artisan", "geoflow:work-ai-optimization"]
    mem_limit: ${AI_OPTIMIZATION_QUEUE_CONTAINER_MEMORY_LIMIT:-384m}
    stop_grace_period: ${GEOFLOW_AI_QUALITY_OPTIMIZATION_STOP_GRACE_PERIOD:-910s}
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  knowledge-queue:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "-d", "memory_limit=160M", "artisan", "queue:work", "redis", "--queue=knowledge", "--sleep=1", "--tries=1", "--timeout=210", "--memory=128", "--max-jobs=20", "--max-time=1800"]
    mem_limit: ${KNOWLEDGE_QUEUE_CONTAINER_MEMORY_LIMIT:-256m}
    stop_grace_period: 240s
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: ${GEOFLOW_APP_IMAGE:-${COMPOSE_PROJECT_NAME:-geoflow-laravel-prod}-app}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
    # Nginx /reverb 内部反代固定走 18080；宿主机端口仅给多版本/外部反代用。
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    expose:
      - "${REVERB_SERVER_PORT:-18080}"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-geoflow-prod-net}
    ipam:
      config:
        # 避开 VPC 172.16.0.0/12，避免容器路由与内网地址冲突。
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.88.0.0/16}
          gateway: ${DOCKER_NETWORK_GATEWAY:-10.88.0.1}
