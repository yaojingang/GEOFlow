name: Publish reviewed CLI trust bundle
on:
  workflow_dispatch:
    inputs:
      trust_version:
        description: New reviewed monotonically increasing trust bundle version
        required: true
        type: number
      trust_sha256:
        description: Reviewed exact trust.json SHA-256
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: geoflow-cli-publication
  cancel-in-progress: false
jobs:
  trust:
    if: github.repository == 'yaojingang/GEOFlow' && github.ref == 'refs/heads/main'
    environment: cli-trust-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - name: Materialize and validate reviewed public trust
        env:
          CLI_TRUST_BUNDLE_B64: ${{ secrets.CLI_TRUST_BUNDLE_B64 }}
          TRUST_VERSION: ${{ inputs.trust_version }}
          EXPECTED: ${{ inputs.trust_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TRUST_VERSION" =~ ^[1-9][0-9]*$ && "$EXPECTED" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/trust-release"
          printf '%s' "$CLI_TRUST_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/trust-release/trust.json"
          test "$(sha256sum "$RUNNER_TEMP/trust-release/trust.json" | cut -d ' ' -f 1)" = "$EXPECTED"
          test "$(jq -er '.version' "$RUNNER_TEMP/trust-release/trust.json")" = "$TRUST_VERSION"
          php -r 'require "packages/geoflow-cli/StandaloneBundle.php"; GeoFlow\Distribution\StandaloneBundle::activeKeys(json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR));' "$RUNNER_TEMP/trust-release/trust.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/trust-release/trust.json
      - name: Publish separate trust release without changing Core Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TRUST_VERSION: ${{ inputs.trust_version }}
        run: python3 -B packages/geoflow-cli/publish.py --tag "cli-trust-v$TRUST_VERSION" --source-commit "$GITHUB_SHA" --directory "$RUNNER_TEMP/trust-release"
