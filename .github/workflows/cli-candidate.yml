name: Build immutable CLI candidate
on:
  workflow_dispatch:
    inputs:
      release_sequence:
        description: Unused increasing CLI release sequence
        required: true
        type: number
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: geoflow-cli-candidate
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'yaojingang/GEOFlow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, curl, fileinfo, sodium
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit packages/geoflow-cli/tests tests/Unit/GeoFlowCli/StandaloneInstallerTest.php tests/Unit/GeoFlowCli/StandaloneBuildTest.php
      - run: python3 -B -m unittest discover -s packages/geoflow-cli/tests -p 'test_*.py'
      - run: php packages/geoflow-cli/smoke.php
      - name: Build unsigned payload from clean source
        env:
          SEQUENCE: ${{ inputs.release_sequence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/candidate"
          php -d phar.readonly=0 scripts/build-geoflow-cli.php --output="$RUNNER_TEMP/cli-build" > "$RUNNER_TEMP/build.json"
          bundle="$(jq -er '.bundle' "$RUNNER_TEMP/build.json")"
          python3 -B packages/geoflow-cli/release.py candidate --bundle "$bundle" --source-commit "$GITHUB_SHA" --sequence "$SEQUENCE" --output "$RUNNER_TEMP/candidate/candidate.tar" > "$RUNNER_TEMP/candidate/candidate.json"
          version="$(jq -er '.version' "$RUNNER_TEMP/candidate/candidate.json")"
          if gh release view "cli-v$version" >/dev/null 2>&1; then
            echo 'This CLI version already has a release; choose an unused version.' >&2
            exit 1
          fi
          python3 -B packages/geoflow-cli/release.py test-candidate --archive "$RUNNER_TEMP/candidate/candidate.tar" > "$RUNNER_TEMP/candidate/acceptance.json"
          php "$bundle/geoflow.phar" --version
          php "$bundle/geoflow.phar" --help >/dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/candidate/candidate.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 30
