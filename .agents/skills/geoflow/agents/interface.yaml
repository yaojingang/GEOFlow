interface:
  display_name: "GEOFlow"
  short_description: "Manage GEOFlow topics, themes, tasks and planned updates"
  default_prompt: "Use $geoflow with a selected CLI profile. Discover identity/capabilities, verify topic/theme contracts, retain Updater plans/stable request IDs, draft versions and receipt checks; report gaps."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
