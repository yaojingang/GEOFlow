server {
    listen 8080;
    server_name _;
    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass http://host.lima.internal:10100;
        proxy_set_header Host localhost:10100;
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / { return 404; }
}
