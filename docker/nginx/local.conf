map $http_x_forwarded_proto $geoflow_forwarded_proto {
    default $scheme;
    ~*^http$ http;
    ~*^https$ https;
}

map "${GEOFLOW_FORWARDED_PREFIX}" $geoflow_forwarded_prefix {
    default "";
    # 仅接受显式配置的单层、最长 64 字符规范路径；留空时清除客户端前缀。
    "~^/[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$" "${GEOFLOW_FORWARDED_PREFIX}";
}

map $http_x_forwarded_port $geoflow_forwarded_port_header {
    default "";
    # 仅接受 1-65535，避免可信上游的错误端口污染 Laravel 生成的绝对 URL。
    "~^(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$" $http_x_forwarded_port;
}

map $http_host $geoflow_host_port {
    "~:((?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))$" $1;
    default "";
}

map "$geoflow_forwarded_port_header:$geoflow_host_port:$geoflow_forwarded_proto" $geoflow_forwarded_port {
    ~^([0-9]+): $1;
    ~^:([0-9]+): $1;
    ~^::https$ 443;
    default $server_port;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location = /manifest.webmanifest {
        access_log off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        access_log off;
        default_type application/javascript;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ^~ /build/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~ ^/reverb/(app|apps)/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $geoflow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_forwarded_port;
        proxy_set_header X-Forwarded-Prefix $geoflow_forwarded_prefix;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        set $geoflow_reverb reverb:8080;
        proxy_pass http://$geoflow_reverb;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|ttf|otf|woff|woff2)$ {
        access_log off;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri @geoflow_app;
    }

    location / {
        try_files /__geoflow_dynamic_request__ @geoflow_app;
    }

    location @geoflow_app {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $geoflow_app app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $geoflow_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_forwarded_port;
        proxy_set_header X-Forwarded-Prefix $geoflow_forwarded_prefix;
        proxy_read_timeout 300s;
        proxy_pass http://$geoflow_app;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
