resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 64m;

root /var/www/html/public;
index index.php;

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options SAMEORIGIN;
add_header Referrer-Policy strict-origin-when-cross-origin;

location ~ /\.(?!well-known).* {
    deny all;
}

location ~ ^/(?:[^/]+/)*articles/batch/export-markdown/prepare$ {
    client_max_body_size 128k;
    try_files $uri $uri/ /index.php?$query_string;
}

# Candidate image pulls run under the updater's bounded preview deadline.
location ~ ^/(?:[^/]+/)*system-updates/updater/plan$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTPS $geoflow_https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_PROTO $geoflow_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $geoflow_forwarded_port;
    set $php_upstream app:9000;
    fastcgi_pass $php_upstream;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 1860;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTPS $geoflow_https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_PROTO $geoflow_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $geoflow_forwarded_port;
    set $php_upstream app:9000;
    fastcgi_pass $php_upstream;
    fastcgi_read_timeout 300;
    internal;
}
